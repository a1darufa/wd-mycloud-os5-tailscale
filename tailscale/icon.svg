<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Icon of the unofficial Tailscale app: three linked nodes of a private
       network. Deliberately not Tailscale's logo, which is their trademark.
       Rendered to the package PNGs by tools/render-icons.sh. -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="#334155"/>
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <line x1="48" y1="27" x2="26" y2="67"/>
    <line x1="48" y1="27" x2="70" y2="67"/>
    <line x1="26" y1="67" x2="70" y2="67"/>
  </g>
  <g fill="#ffffff">
    <circle cx="48" cy="27" r="11"/>
    <circle cx="26" cy="67" r="11"/>
    <circle cx="70" cy="67" r="11"/>
  </g>
</svg>
